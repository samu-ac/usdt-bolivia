name: Actualizar precios USDT Bolivia

on:
  schedule:
    # Cada 2 horas en días hábiles bolivianos (UTC-4)
    # Cubre 08:00–22:00 BOL (12:00–02:00 UTC del día siguiente)
    - cron: '0 12,14,16,18,20,22 * * 1-5'
    - cron: '0 0,2 * * 2-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Obtener precios USDT y VRD BCB
        run: python fetch_prices.py
        env:
          ELDORADO_API_KEY: ${{ secrets.ELDORADO_API_KEY }}
          WALLBIT_API_KEY:  ${{ secrets.WALLBIT_API_KEY }}

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/bcb_vrd.json
          git diff --staged --quiet || git commit -m "Actualizacion de precios - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
