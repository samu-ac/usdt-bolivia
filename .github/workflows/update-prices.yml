name: Actualizar precios USDT Bolivia

on:
  schedule:
    # Cada 4 horas en horario laboral boliviano (UTC-4)
    # 08:00 BOL = 12:00 UTC
    # 12:00 BOL = 16:00 UTC
    # 16:00 BOL = 20:00 UTC
    # 20:00 BOL = 00:00 UTC
    - cron: '0 12 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '0 0  * * 2-6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Obtener precios USDT y VRD BCB
        run: python fetch_prices.py

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/bcb_vrd.json
          git diff --staged --quiet || git commit -m "Actualizacion de precios - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
